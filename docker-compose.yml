version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6J8Yr-6H5fOoAea2SOaL00r0IBKdlMMQ7eUMCvLRdCsWg}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - BLINDSPOT_DB_PATH=/app/blindspot.db
    volumes:
      - backend-data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  backend-data:
